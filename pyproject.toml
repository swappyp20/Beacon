[project]
name = "beacon"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "slack-bolt>=1.21",
  "anthropic>=0.40",
  "mcp>=1.2",
  "httpx>=0.27",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
